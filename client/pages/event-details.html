<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details - EventHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .event-hero {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 2rem 0;
      margin-bottom: 2rem;
    }

    .event-details-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .event-image-large {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
    }

    .event-sidebar {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: var(--shadow);
      height: fit-content;
    }

    .event-info-item {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: flex-start;
    }

    .event-info-icon {
      font-size: 1.5rem;
      min-width: 30px;
    }

    .event-info-text h4 {
      margin: 0 0 0.5rem 0;
      color: var(--text-dark);
    }

    .event-info-text p {
      margin: 0;
      color: var(--text-light);
    }

    .register-button {
      width: 100%;
      margin-bottom: 1rem;
    }

    .capacity-bar {
      width: 100%;
      height: 10px;
      background: var(--light-gray);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .capacity-fill {
      height: 100%;
      background: var(--primary-color);
      transition: width 0.3s ease;
    }

    .capacity-text {
      font-size: 0.875rem;
      color: var(--text-light);
      margin-top: 0.5rem;
    }

    .event-description {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    .event-description h2 {
      color: var(--text-dark);
      margin-bottom: 1rem;
    }

    .event-description p {
      color: var(--text-light);
      line-height: 1.8;
    }

    .registration-status {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      text-align: center;
      font-weight: 500;
    }

    .registration-status.registered {
      background: #c6f6d5;
      color: #22543d;
    }

    .registration-status.full {
      background: #fed7d7;
      color: #742a2a;
    }

    @media (max-width: 768px) {
      .event-details-grid {
        grid-template-columns: 1fr;
      }

      .event-image-large {
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <div class="container">
      <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">📅 EventHub</div>
      <ul>
        <li><a href="events.html">Events</a></li>
        <li id="navMyEvents"><a href="my-events.html">My Events</a></li>
      </ul>
      <div class="auth-buttons" id="authButtons"></div>
    </div>
  </nav>

  <!-- Event Details -->
  <div id="loadingContainer" class="loading">
    <div class="loader"></div>
  </div>

  <div id="eventContainer"></div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 EventHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    page.requireAuth();

    const eventId = utils.getURLParams().id;

    async function loadEvent() {
      try {
        const { event } = await api.getEvent(eventId);
        displayEvent(event);
        updateUI();
      } catch (error) {
        Toast.error('Error loading event');
        console.error(error);
      } finally {
        document.getElementById('loadingContainer').classList.add('hidden');
      }
    }

    function displayEvent(event) {
      const capacityPercentage = (event.registeredCount / event.capacity) * 100;
      const isFull = event.registeredCount >= event.capacity;
      const isPast = dateUtils.isPastDate(event.date);

      const container = document.getElementById('eventContainer');
      container.innerHTML = `
        <div class="event-hero">
          <div class="container">
            <button onclick="history.back()" class="btn btn-secondary" style="margin-bottom: 1rem;">← Back</button>
            <h1>${event.title}</h1>
            <p>${event.category}</p>
          </div>
        </div>

        <div class="container">
          <div class="event-details-grid">
            <div>
              <img src="${event.image}" alt="${event.title}" class="event-image-large">
            </div>
            <div class="event-sidebar">
              <div id="registrationStatus"></div>

              <button
                class="btn btn-primary register-button"
                id="registerBtn"
                onclick="registerEvent()"
                ${isFull || isPast ? 'disabled' : ''}
              >
                ${isFull ? 'Event Full' : isPast ? 'Event Ended' : 'Register Now'}
              </button>

              <button
                class="btn btn-secondary register-button"
                onclick="window.location.href='events.html'"
              >
                Browse More Events
              </button>

              <div class="event-info-item">
                <div class="event-info-icon">📅</div>
                <div class="event-info-text">
                  <h4>Date</h4>
                  <p>${dateUtils.formatDate(event.date)}</p>
                </div>
              </div>

              <div class="event-info-item">
                <div class="event-info-icon">🕐</div>
                <div class="event-info-text">
                  <h4>Time</h4>
                  <p>${event.time}</p>
                </div>
              </div>

              <div class="event-info-item">
                <div class="event-info-icon">📍</div>
                <div class="event-info-text">
                  <h4>Location</h4>
                  <p>${event.location}</p>
                </div>
              </div>

              <div class="event-info-item">
                <div class="event-info-icon">👥</div>
                <div class="event-info-text">
                  <h4>Capacity</h4>
                  <p>${event.capacity} Seats</p>
                  <div class="capacity-bar">
                    <div class="capacity-fill" style="width: ${capacityPercentage}%"></div>
                  </div>
                  <p class="capacity-text">${event.registeredCount}/${event.capacity} Registered</p>
                </div>
              </div>

              <div class="event-info-item">
                <div class="event-info-icon">🏢</div>
                <div class="event-info-text">
                  <h4>Organizer</h4>
                  <p>${event.createdBy.name}</p>
                </div>
              </div>
            </div>
          </div>

          <div class="event-description">
            <h2>About this Event</h2>
            <p>${event.description}</p>
          </div>
        </div>
      `;
    }

    async function registerEvent() {
      try {
        const button = document.getElementById('registerBtn');
        button.disabled = true;
        
        await api.registerEvent(eventId);
        Toast.success('Successfully registered for this event!');
        
        setTimeout(() => {
          loadEvent();
        }, 1000);
      } catch (error) {
        Toast.error(error.message || 'Registration failed');
        document.getElementById('registerBtn').disabled = false;
      }
    }

    async function checkRegistrationStatus() {
      try {
        const { registrations } = await api.getUserRegistrations();
        const isRegistered = registrations.some(r => r.eventId._id === eventId && r.status === 'registered');
        
        const statusDiv = document.getElementById('registrationStatus');
        if (isRegistered) {
          statusDiv.innerHTML = '<div class="registration-status registered">✓ You are registered for this event</div>';
        }
      } catch (error) {
        console.error(error);
      }
    }

    function updateUI() {
      const authButtons = document.getElementById('authButtons');
      const navMyEvents = document.getElementById('navMyEvents');

      if (storage.isAuthenticated()) {
        const user = storage.getUser();
        authButtons.innerHTML = `
          <div class="user-menu">
            <button onclick="toggleMenu()">${user.name} ▼</button>
            <div class="dropdown-menu" id="userMenu">
              <a href="profile.html">Profile</a>
              <a href="my-events.html">My Events</a>
              ${storage.isAdmin() ? '<a href="admin-dashboard.html">Admin Dashboard</a>' : ''}
              <a href="#" onclick="logout(); return false;">Logout</a>
            </div>
          </div>
        `;
        navMyEvents.style.display = 'block';
        checkRegistrationStatus();
      }
    }

    function toggleMenu() {
      const menu = document.getElementById('userMenu');
      if (menu) {
        menu.classList.toggle('active');
      }
    }

    function logout() {
      storage.clearUser();
      api.logout();
      window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', loadEvent);

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('userMenu');
      if (menu && !e.target.closest('.user-menu')) {
        menu.classList.remove('active');
      }
    });
  </script>
</body>
</html>
