<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .events-page {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }
    .sidebar {
      background: #f5f5f5;
      padding: 1.25rem;
      border-radius: 4px;
      border: 1px solid #e8e8e8;
      height: fit-content;
    }
    .filter-group { margin-bottom: 1.5rem; }
    .filter-group h3 { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.75rem; color: #0a0a0a; }
    .filter-option { margin-bottom: 0.5rem; }
    .filter-option input[type="checkbox"] { margin-right: 0.4rem; accent-color: #0a0a0a; }
    .filter-option label { margin-bottom: 0; font-weight: 400; font-size: 0.875rem; cursor: pointer; display: inline-flex; align-items: center; text-transform: none; letter-spacing: 0; }
    .search-box { margin-bottom: 1.5rem; }
    .search-box input { width: 100%; }

    .events-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #0a0a0a;
    }
    .events-header h1 { margin: 0; font-size: 1.5rem; }

    .events-grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
    .event-card {
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #e8e8e8;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .event-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .event-image { width: 100%; height: 160px; object-fit: cover; display: block; filter: grayscale(100%); border-bottom: 1px solid #e8e8e8; }
    .event-content { padding: 1.25rem; }
    .event-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; color: #0a0a0a; }
    .event-category {
      display: inline-block;
      background: #0a0a0a;
      color: #fff;
      padding: 0.1rem 0.5rem;
      border-radius: 2px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.65rem;
    }
    .event-meta { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.75rem; font-size: 0.8rem; color: #707070; }
    .event-meta span { display: flex; align-items: center; gap: 0.4rem; }
    .event-description { color: #707070; margin-bottom: 0.75rem; font-size: 0.825rem; line-height: 1.5; }
    .event-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 0.75rem; border-top: 1px solid #e8e8e8; }
    .event-capacity { font-size: 0.8rem; color: #a0a0a0; }
    .event-capacity.full { color: #0a0a0a; font-weight: 600; }
    .no-events { text-align: center; padding: 4rem; color: #a0a0a0; }

    /* Create Event Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 4px;
      border: 1px solid #e8e8e8;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      animation: slideInUp 0.2s ease;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #0a0a0a;
    }
    .modal-header h2 { margin: 0; font-size: 1.1rem; letter-spacing: -0.02em; }
    .modal-close { background: none; border: none; font-size: 1.25rem; cursor: pointer; color: #a0a0a0; line-height: 1; padding: 0; }
    .modal-close:hover { color: #0a0a0a; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn-create-event { display: none; }

    @media (max-width: 768px) {
      .events-page { grid-template-columns: 1fr; }
      .sidebar { grid-column: 1; grid-row: 1; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <div class="container">
      <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">📅 EventHub</div>
      <ul>
        <li><a href="events.html">Events</a></li>
        <li id="navMyEvents"><a href="my-events.html">My Events</a></li>
      </ul>
      <div class="auth-buttons" id="authButtons">
        <a href="login.html" class="btn btn-secondary">Login</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container" style="margin-top: 2rem; margin-bottom: 2rem;">
    <div class="events-page">
      <!-- Sidebar Filters -->
      <div class="sidebar">
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Search events..."
            style="width: 100%;"
          >
        </div>

        <div class="filter-group">
          <h3>Categories</h3>
          <div id="categoriesContainer"></div>
        </div>
      </div>

      <!-- Events Content -->
      <div>
        <div class="events-header">
          <h1>Upcoming Events</h1>
          <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
            <select id="sortBy" style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 5px;">
              <option value="date">Sort by Date</option>
              <option value="title">Sort by Title</option>
            </select>
            <button id="btnCreateEvent" class="btn btn-primary btn-create-event" onclick="openCreateModal()">
              ➕ Create Event
            </button>
          </div>
        </div>

        <div id="eventsContainer" class="events-grid"></div>

        <div id="noEvents" class="no-events hidden">
          <p>No events found. Try adjusting your filters.</p>
        </div>

        <div id="loadingContainer" class="loading hidden">
          <div class="loader"></div>
        </div>

        <!-- Pagination -->
        <div id="paginationContainer" style="margin-top: 2rem;"></div>
      </div>
    </div>
  </div>

  <!-- Create Event Modal -->
  <div class="modal-overlay" id="createEventModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>✨ Create New Event</h2>
        <button class="modal-close" onclick="closeCreateModal()">✕</button>
      </div>
      <form id="createEventForm">
        <div class="form-group">
          <label for="eventTitle">Event Title *</label>
          <input type="text" id="eventTitle" name="title" placeholder="Enter event title" required>
        </div>
        <div class="form-group">
          <label for="eventDescription">Description *</label>
          <textarea id="eventDescription" name="description" rows="3" placeholder="Describe your event..." required style="width:100%; resize:vertical;"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="eventDate">Date *</label>
            <input type="date" id="eventDate" name="date" required>
          </div>
          <div class="form-group">
            <label for="eventTime">Time * (HH:MM)</label>
            <input type="time" id="eventTime" name="time" required>
          </div>
        </div>
        <div class="form-group">
          <label for="eventLocation">Location *</label>
          <input type="text" id="eventLocation" name="location" placeholder="Venue / Online" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="eventCategory">Category *</label>
            <select id="eventCategory" name="category" required style="width:100%; padding:0.6rem; border:1px solid var(--border-color); border-radius:5px;">
              <option value="">Select category</option>
              <option>Conference</option>
              <option>Seminar</option>
              <option>Workshop</option>
              <option>Webinar</option>
              <option>Hackathon</option>
              <option>Cultural Event</option>
              <option>Sports Event</option>
              <option>Training Session</option>
            </select>
          </div>
          <div class="form-group">
            <label for="eventCapacity">Capacity *</label>
            <input type="number" id="eventCapacity" name="capacity" min="1" placeholder="Max attendees" required>
          </div>
        </div>
        <div class="form-group">
          <label for="eventImage">Image URL (optional)</label>
          <input type="url" id="eventImage" name="image" placeholder="https://...">
        </div>
        <div style="display:flex; gap:1rem; margin-top:1rem;">
          <button type="submit" class="btn btn-primary" id="submitEventBtn" style="flex:1;">Create Event</button>
          <button type="button" class="btn btn-secondary" onclick="closeCreateModal()" style="flex:1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 EventHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    // Initialize
    let currentPage = 1;
    let currentFilters = {};

    // Check authentication and update UI
    function updateUI() {
      const authButtons = document.getElementById('authButtons');
      const navMyEvents = document.getElementById('navMyEvents');
      const btnCreate = document.getElementById('btnCreateEvent');

      if (storage.isAuthenticated()) {
        const user = storage.getUser();
        authButtons.innerHTML = `
          <div class="user-menu">
            <button onclick="toggleMenu()">${user.name} ▼</button>
            <div class="dropdown-menu" id="userMenu">
              <a href="profile.html">Profile</a>
              <a href="my-events.html">My Events</a>
              ${storage.isAdmin() ? '<a href="admin-dashboard.html">Admin Dashboard</a>' : ''}
              <a href="#" onclick="logout(); return false;">Logout</a>
            </div>
          </div>
        `;
        navMyEvents.style.display = 'block';
        // Show Create Event button for ALL logged-in users
        btnCreate.style.display = 'inline-block';
      } else {
        navMyEvents.style.display = 'none';
        btnCreate.style.display = 'none';
      }
    }

    // Modal controls
    function openCreateModal() {
      if (!storage.isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      document.getElementById('createEventModal').classList.add('active');
      document.getElementById('createEventForm').reset();
      // Set min date to tomorrow
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('eventDate').min = tomorrow.toISOString().split('T')[0];
    }

    function closeCreateModal() {
      document.getElementById('createEventModal').classList.remove('active');
    }

    // Close modal on overlay click
    document.getElementById('createEventModal').addEventListener('click', function(e) {
      if (e.target === this) closeCreateModal();
    });

    // Create Event form submit
    document.getElementById('createEventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitEventBtn');
      btn.disabled = true;
      btn.textContent = 'Creating...';

      const data = {
        title: document.getElementById('eventTitle').value.trim(),
        description: document.getElementById('eventDescription').value.trim(),
        date: document.getElementById('eventDate').value,
        time: document.getElementById('eventTime').value,
        location: document.getElementById('eventLocation').value.trim(),
        category: document.getElementById('eventCategory').value,
        capacity: parseInt(document.getElementById('eventCapacity').value),
        image: document.getElementById('eventImage').value.trim() || undefined,
      };

      try {
        await api.createEvent(data);
        Toast.success('Event created successfully! 🎉');
        closeCreateModal();
        loadEvents(); // Refresh the list
      } catch (error) {
        Toast.error(error.message || 'Failed to create event');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Event';
      }
    });

    function toggleMenu() {
      const menu = document.getElementById('userMenu');
      if (menu) {
        menu.classList.toggle('active');
      }
    }

    function logout() {
      storage.clearUser();
      api.logout();
      window.location.href = 'index.html';
    }

    // Load categories
    async function loadCategories() {
      try {
        const { categories } = await api.getCategories();
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = categories.map(cat => `
          <div class="filter-option">
            <input type="checkbox" id="cat-${cat}" value="${cat}" onchange="filterEvents()">
            <label for="cat-${cat}">${cat}</label>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading categories:', error);
      }
    }

    // Load and display events
    async function loadEvents() {
      try {
        document.getElementById('loadingContainer').classList.remove('hidden');
        document.getElementById('eventsContainer').innerHTML = '';

        const filters = {
          ...currentFilters,
          page: currentPage,
          limit: 9,
        };

        const { events, pagination } = await api.getEvents(filters);

        if (events.length === 0) {
          document.getElementById('noEvents').classList.remove('hidden');
        } else {
          document.getElementById('noEvents').classList.add('hidden');
          displayEvents(events);
        }

        displayPagination(pagination);
      } catch (error) {
        Toast.error('Error loading events');
        console.error(error);
      } finally {
        document.getElementById('loadingContainer').classList.add('hidden');
      }
    }

    function displayEvents(events) {
      const container = document.getElementById('eventsContainer');
      container.innerHTML = events.map(event => `
        <div class="event-card fade-in">
          <img src="${event.image}" alt="${event.title}" class="event-image">
          <div class="event-content">
            <span class="event-category">${event.category}</span>
            <h3 class="event-title">${event.title}</h3>
            <div class="event-meta">
              <span>📅 ${dateUtils.formatDate(event.date)}</span>
              <span>🕐 ${event.time}</span>
              <span>📍 ${event.location}</span>
            </div>
            <p class="event-description">${utils.truncate(event.description, 100)}</p>
            <div class="event-footer">
              <div class="event-capacity ${event.registeredCount >= event.capacity ? 'full' : ''}">
                ${event.registeredCount}/${event.capacity} Registered
              </div>
              <button class="btn btn-primary btn-small" onclick="viewEvent('${event._id}')">View</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function displayPagination(pagination) {
      const container = document.getElementById('paginationContainer');
      if (pagination.total <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '<div class="pagination">';

      if (pagination.current > 1) {
        html += `<button onclick="goToPage(${pagination.current - 1})">← Previous</button>`;
      }

      for (let i = 1; i <= pagination.total; i++) {
        html += `<button ${i === pagination.current ? 'class="active"' : ''} onclick="goToPage(${i})">${i}</button>`;
      }

      if (pagination.current < pagination.total) {
        html += `<button onclick="goToPage(${pagination.current + 1})">Next →</button>`;
      }

      html += '</div>';
      container.innerHTML = html;
    }

    function filterEvents() {
      currentPage = 1;
      currentFilters = {};

      // Get selected categories
      const selectedCategories = Array.from(document.querySelectorAll('.filter-option input[type="checkbox"]:checked'))
        .map(cb => cb.value);

      if (selectedCategories.length > 0) {
        currentFilters.category = selectedCategories[0];
      }

      // Get search query
      const searchQuery = document.getElementById('searchInput').value;
      if (searchQuery) {
        currentFilters.search = searchQuery;
      }

      loadEvents();
    }

    function viewEvent(eventId) {
      window.location.href = `event-details.html?id=${eventId}`;
    }

    function goToPage(page) {
      currentPage = page;
      loadEvents();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', utils.debounce(filterEvents, 300));
    document.getElementById('sortBy').addEventListener('change', (e) => {
      currentFilters.sortBy = e.target.value;
      currentPage = 1;
      loadEvents();
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      updateUI();
      loadCategories();
      loadEvents();
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('userMenu');
      if (menu && !e.target.closest('.user-menu')) {
        menu.classList.remove('active');
      }
    });
  </script>
</body>
</html>
